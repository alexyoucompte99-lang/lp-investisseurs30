<!doctype html>

<title>Ouverture de WhatsApp…</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         background: #0d1321; color: #f5f2ea; text-align: center; }
  .box { padding: 32px 24px; }
  a.btn { display: inline-block; margin-top: 18px; padding: 14px 28px; border-radius: 10px;
          background: #25D366; color: #fff; text-decoration: none; font-weight: 600; }

</style>

<body>
<div class="box">
  <h1>Ouverture de WhatsApp…</h1>
  <p>Si rien ne se passe, appuie sur le bouton ci-dessous.</p>
  <a class="btn" id="go" href="#">Ouvrir WhatsApp</a>
</div>
<script>
  /* Répartition aléatoire des demandes WhatsApp du Scan Patrimoine
     entre Louis et Romain (Adrien exclu, demande d'Alex 29/08/2026). */
  var CLOSERS = ["33780942326", "33781240572"]; // Louis, Romain
  var num = CLOSERS[Math.floor(Math.random() * CLOSERS.length)];
  var msg = "Bonjour ! Je viens de faire le Scan Patrimoine et de réserver mon appel bilan. " +
            "J'aimerais recevoir le récap de mon appel ici sur WhatsApp.";
  var url = "https://wa.me/" + num + "?text=" + encodeURIComponent(msg);
  document.getElementById("go").href = url;
  window.location.replace(url);
</script>
<noscript>
  <p>Écris-nous sur WhatsApp : <a href="https://wa.me/33780942326">+33 7 80 94 23 26</a></p>
</noscript>
